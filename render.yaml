services:
  - type: web
    name: noavoice-livekit-backend
    env: python
    plan: standard

    # Build and Deploy Commands
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class uvicorn.workers.UvicornWorker --workers 2 --timeout 120 --bind 0.0.0.0:$PORT main:app

    # Environment Variables
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.0

    # Health Check
    healthCheckPath: /health

    # Auto Deploy from Git
    autoDeploy: true